<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统管理 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>系统管理</h1>
    </div>

    <section class="av-card" id="tabs">
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-tab="users" type="button">账号</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="params" type="button">参数</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="monitor" type="button">运行监控</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="logs" type="button">操作日志</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="messages" type="button">消息</button></li>
      </ul>

      <div data-panel="users">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 small">
            <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr></thead>
            <tbody id="users"></tbody>
          </table>
        </div>
      </div>

      <div data-panel="params" hidden>
        <form id="params" class="row g-3" novalidate>
          <div class="col-md-4"><label class="form-label small" for="p-retention">中间文件保留天数</label>
            <input class="form-control form-control-sm" id="p-retention" name="retention_days" type="number" min="1" max="365"></div>
          <div class="col-md-4"><label class="form-label small" for="p-workers">批量识别并发数</label>
            <input class="form-control form-control-sm" id="p-workers" name="max_concurrency" type="number" min="1" max="10"></div>
          <div class="col-md-4"><label class="form-label small" for="p-interval">识别间隔（ms）</label>
            <input class="form-control form-control-sm" id="p-interval" name="detect_interval_ms" type="number" min="100" max="2000" step="50"></div>
          <div class="col-md-4"><label class="form-label small" for="p-quality">质量分阈值</label>
            <input class="form-control form-control-sm" id="p-quality" name="quality_threshold" type="number" min="0" max="100"></div>
          <div class="col-md-4"><label class="form-label small" for="p-camera">摄像头编号</label>
            <input class="form-control form-control-sm" id="p-camera" name="camera_index" type="number" min="0" max="9"></div>
          <div class="col-12"><button class="btn btn-primary btn-sm" type="submit">保存参数</button>
            <span class="small text-secondary ms-2">超出范围的项会就地标红，不会保存；每次修改都会写入操作日志</span></div>
        </form>
        <div id="params-state"></div>
      </div>

      <div data-panel="monitor" hidden>
        <div class="row g-3" id="monitor"></div>
        <p class="small text-secondary mt-3 mb-0" id="monitor-note"></p>
      </div>

      <div data-panel="logs" hidden>
        <form class="d-flex gap-2 mb-3" id="log-filter">
          <select class="form-select form-select-sm w-auto" id="log-module" name="module" aria-label="模块">
            <option value="">全部模块</option><option value="auth">登录</option><option value="capture">采集</option>
            <option value="review">复核</option><option value="model">模型</option><option value="dataset">数据集</option>
            <option value="system">参数</option><option value="species">物种字典</option><option value="user">账号</option>
          </select>
          <button class="btn btn-sm btn-outline-primary" type="submit">查询</button>
        </form>
        <div class="table-responsive">
          <table class="table align-middle mb-0 small">
            <thead><tr><th>时间</th><th>用户</th><th>模块</th><th>动作</th><th>对象</th><th>变更前</th><th>变更后</th></tr></thead>
            <tbody id="logs"></tbody>
          </table>
        </div>
      </div>

      <ul data-panel="messages" class="list-unstyled mb-0 d-grid gap-2" id="messages" hidden></ul>
    </section>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { bindTabs, confirmAction, esc, fmtTime, loadInto, toast } from "../static/js/ui.js";

    renderShell("P-13");

    function $(id) { return document.getElementById(id); }
    const ROLE = { admin: "管理员", analyst: "分析员", algo: "算法员", observer: "采集员" };
    const MSG = { capture_fail: ["采集失败", "danger"], task_fail: ["任务失败", "warning"], report_done: ["报告完成", "success"] };
    const MONITOR_MS = 30000; // FR-M8-01: the panel refreshes every 30 s
    const time = (iso) => (iso ? fmtTime(iso).slice(0, -3) : "—");
    const fail = (err) => toast(err.message, "danger");

    bindTabs($("tabs"));
    const wanted = new URLSearchParams(location.search).get("tab");
    document.querySelector(`[data-tab="${wanted}"]`)?.click();

    const loadUsers = () => loadInto($("users"), api.listUsers, {
      isEmpty: (d) => d.items.length === 0,
      empty: "还没有任何账号",
      render: ({ items }) => {
        $("users").innerHTML = items.map((u) => `<tr>
          <td class="av-mono">${esc(u.username)}</td><td>${esc(u.real_name)}</td><td>${ROLE[u.role] ?? esc(u.role)}</td>
          <td>${u.status ? '<span class="badge text-bg-success">启用</span>' : '<span class="badge text-bg-secondary">停用</span>'}</td>
          <td>${time(u.last_login_at)}</td>
          <td class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-${u.status ? "danger" : "success"}" data-user="${u.user_id}" data-name="${esc(u.username)}" data-act="${u.status ? "disable" : "enable"}" type="button">${u.status ? "停用" : "恢复"}</button>
            <button class="btn btn-sm btn-outline-secondary" data-user="${u.user_id}" data-name="${esc(u.username)}" data-act="reset" type="button">重置密码</button></td></tr>`).join("");
      },
    });

    $("users").addEventListener("click", async (event) => {
      const btn = event.target.closest("[data-act]");
      if (!btn) return;
      const { user: id, name } = btn.dataset;
      try {
        if (btn.dataset.act === "reset") {
          const password = window.prompt(`给 ${name} 设置一个临时密码（至少 8 位），并当面告知本人：`);
          if (password === null) return;
          if (password.length < 8) return toast("临时密码至少 8 位", "warning");
          await api.resetPassword(id, password);
          toast(`${name} 的密码已重置`, "success");
        } else {
          const enable = btn.dataset.act === "enable";
          if (!confirmAction(`${enable ? "恢复" : "停用"}账号 ${name}？`)) return;
          await api.setUserStatus(id, enable ? 1 : 0);
          toast(`已${enable ? "恢复" : "停用"} ${name}`, "success");
          await loadUsers();
        }
      } catch (err) {
        fail(err);
      }
    });

    // The form stays in the page; the state area under it shows loading or a failure.
    const loadParams = () => loadInto($("params-state"), api.getParams, {
      isEmpty: () => false,
      empty: "",
      render: (params) => {
        for (const [name, value] of Object.entries(params)) if ($("params").elements[name]) $("params").elements[name].value = value;
        $("params-state").innerHTML = "";
      },
    });

    $("params").addEventListener("submit", async (event) => {
      event.preventDefault();
      const inputs = [...$("params").querySelectorAll("input")];
      inputs.forEach((el) => el.classList.toggle("is-invalid", !el.checkValidity() || el.value === ""));
      if (inputs.some((el) => el.classList.contains("is-invalid"))) return;
      try {
        const { changed } = await api.updateParams(Object.fromEntries(inputs.map((el) => [el.name, Number(el.value)])));
        const n = Object.keys(changed ?? {}).length;
        toast(n ? `已保存 ${n} 项参数，新任务开始生效` : "参数没有变化", "success");
      } catch (err) {
        fail(err);
      }
    });

    const card = (label, value, note = "") => `<div class="col-6 col-lg-3"><div class="av-card">
      <div class="av-kpi-label">${label}</div><div class="av-kpi-value">${value}</div><div class="small text-secondary">${note}</div></div></div>`;

    const loadMonitor = (quiet = false) => loadInto($("monitor"), api.getMonitor, {
      quiet,
      isEmpty: () => false,
      empty: "",
      render: (m) => {
        $("monitor").innerHTML =
          card("识别队列", m.queue.queued, `运行中 ${m.queue.running}`) +
          card("已入库帧", m.frames, "全部采集帧") +
          card("磁盘占用", `${m.disk.percent}%`, `${m.disk.used_gb} / ${m.disk.total_gb} GB`) +
          card("并发上限", m.max_concurrency, "批量识别的 worker 数");
        $("monitor-note").textContent = `最近刷新 ${fmtTime(m.at)} · 每 30 秒自动刷新`;
      },
    });

    const loadLogs = () => loadInto($("logs"), () => api.listLogs(Object.fromEntries(new FormData($("log-filter")))), {
      isEmpty: (d) => d.items.length === 0,
      empty: "没有匹配的日志",
      render: ({ items }) => {
        $("logs").innerHTML = items.map((l) => `<tr><td>${time(l.created_at)}</td><td class="av-mono">${l.user_id ?? "—"}</td>
          <td>${esc(l.module)}</td><td>${esc(l.action)}</td><td class="av-mono">${esc(l.target_id ?? "")}</td>
          <td class="av-log-value" title="${esc(l.before_value ?? "")}">${esc(l.before_value ?? "")}</td>
          <td class="av-log-value" title="${esc(l.after_value ?? "")}">${esc(l.after_value ?? "")}</td></tr>`).join("");
      },
    });

    $("log-filter").addEventListener("submit", (event) => {
      event.preventDefault();
      loadLogs();
    });

    const loadMessages = () => loadInto($("messages"), api.listMessages, {
      isEmpty: (d) => d.items.length === 0,
      empty: "没有消息",
      render: ({ items }) => {
        $("messages").innerHTML = items.map((m) => {
          const [label, kind] = MSG[m.type] ?? [m.type, "secondary"];
          return `<li class="av-object-row${m.is_read ? "" : " is-selected"}">
            <span class="badge text-bg-${kind}">${esc(label)}</span>
            <span class="flex-grow-1"><strong>${esc(m.title)}</strong> ${esc(m.content ?? "")}</span>
            <span class="small text-secondary">${time(m.created_at)}</span>
            ${m.is_read ? '<span class="small text-secondary">已读</span>' : `<button class="btn btn-sm btn-outline-primary" data-msg="${m.msg_id}" type="button">标为已读</button>`}</li>`;
        }).join("");
      },
    });

    $("messages").addEventListener("click", async (event) => {
      const id = event.target.closest("[data-msg]")?.dataset.msg;
      if (!id) return;
      try {
        await api.markRead(id);
        await loadMessages();
      } catch (err) {
        fail(err);
      }
    });

    loadUsers();
    loadParams();
    loadMonitor();
    loadLogs();
    loadMessages();
    setInterval(() => loadMonitor(true), MONITOR_MS);
  </script>
</body>
</html>
