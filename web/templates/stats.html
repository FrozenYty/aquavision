<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计分析 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>统计分析</h1>
      <div class="av-page-actions">
        <label class="small text-secondary align-self-center" for="basis">统计口径</label>
        <select class="form-select form-select-sm w-auto" id="basis" aria-label="统计口径">
          <option value="reviewed">复核后结果</option><option value="raw">原始识别结果</option>
        </select>
        <a class="btn btn-primary text-nowrap" href="reports.html">生成巡检报告</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">物种组成 <small class="text-secondary fw-normal" id="cap-species"></small></h2>
          <div id="chart-species"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">采集量趋势 <small class="text-secondary fw-normal">每日采集帧数 · 不区分口径</small></h2>
          <div id="chart-trend"></div>
          <p class="small text-secondary mt-2 mb-0" id="sum-trend"></p>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">质量拦截率 <small class="text-secondary fw-normal">近 7 日重拍帧占比 · 不区分口径</small></h2>
          <div id="chart-quality"></div>
          <p class="small text-secondary mt-2 mb-0" id="sum-quality"></p>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">复核修正分布 <small class="text-secondary fw-normal">近 7 日改动次数 · 不区分口径</small></h2>
          <div id="chart-corrections"></div>
          <p class="small text-secondary mt-2 mb-0" id="sum-corrections"></p>
        </section>
      </div>
    </div>

    <p class="text-secondary small mt-2 mb-0" id="demo-note" hidden>数字为演示数据，非真实运行结果。</p>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { loadInto, showEmpty, showError, showLoading } from "../static/js/ui.js";
    import { renderSpeciesDonut, renderTotalBars, renderTrendLine } from "../static/js/charts.js";
    import { correctionsView, qualityView, speciesView, trendView } from "../static/js/stats.js";

    renderShell();

    const $ = (id) => document.getElementById(id);
    $("demo-note").hidden = !api.USE_MOCK;

    // Every card draws from one view of one response (stats.js): its figures, its caption and its empty
    // state come from the same place, so they cannot disagree.
    function show(el, view, draw) {
      if (view.empty) showEmpty(el, view.emptyText);
      else draw(el, view);
    }

    // The species chart follows the basis, and its caption is set from the same response as its numbers.
    // Only the newest request is drawn: if the user switches twice quickly, an older answer arriving late
    // must not put one basis's numbers under the other's caption.
    let speciesRequest = 0;
    async function loadSpecies() {
      const request = ++speciesRequest;
      const el = $("chart-species");
      $("cap-species").textContent = "";
      showLoading(el);
      try {
        const data = await api.statsSpecies({ basis: $("basis").value, days: 7 });
        if (request !== speciesRequest) return;
        const view = speciesView(data, { mock: api.USE_MOCK });
        $("cap-species").textContent = view.caption;
        show(el, view, (target, v) => renderSpeciesDonut(target, v.rows, v.total));
      } catch (error) {
        if (request === speciesRequest) showError(el, error, loadSpecies);
      }
    }
    $("basis").addEventListener("change", loadSpecies);
    loadSpecies();

    // The other three cards: each draws its chart and writes its figures line from the same view.
    function card(chart, fetch, toView, draw) {
      loadInto($(`chart-${chart}`), async () => toView(await fetch()), {
        isEmpty: () => false,
        render: (view) => {
          show($(`chart-${chart}`), view, draw);
          $(`sum-${chart}`).textContent = view.empty ? "" : view.caption;
        },
      });
    }
    card("trend", api.statsTrend, trendView, (el, v) => renderTrendLine(el, v.rows));
    card("quality", api.statsQuality, qualityView, (el, v) => renderTotalBars(el, v.bars));
    card("corrections", api.statsCorrections, correctionsView, (el, v) => renderTotalBars(el, v.bars));
  </script>
</body>
</html>
