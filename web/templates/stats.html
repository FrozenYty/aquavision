<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计看板 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>统计看板</h1>
      <div class="av-page-actions">
        <a class="btn btn-primary text-nowrap" href="reports.html">生成巡检报告</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">物种组成 <small class="text-secondary fw-normal">近 7 日目标框数</small></h2>
          <div id="chart-species"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">采集量趋势 <small class="text-secondary fw-normal">每日收帧</small></h2>
          <div id="chart-trend"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">质量拦截率 <small class="text-secondary fw-normal">低质量帧占比</small></h2>
          <div id="chart-quality"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">复核修正分布 <small class="text-secondary fw-normal">人工改动汇总</small></h2>
          <div id="chart-corrections"></div>
        </section>
      </div>
    </div>

    <p class="text-secondary small mt-2 mb-0" id="demo-note" hidden>数字为演示数据，非真实运行结果。</p>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { loadInto } from "../static/js/ui.js";
    import {
      renderSpeciesDonut,
      renderTrendLine,
      renderInterceptBars,
      renderCorrectionStack,
    } from "../static/js/charts.js";

    renderShell("P-10");

    const $ = (id) => document.getElementById(id);
    $("demo-note").hidden = !api.USE_MOCK;

    // The prototype's fixtures hold per-class and per-day arrays; the server answers species and trend
    // as { items }, and quality and corrections as totals only. The two charts drawn per day and per
    // class therefore show the totals in words until the contract offers the breakdown.
    const summary = (html) => `<p class="small mb-0">${html}</p>`;

    loadInto($("chart-species"), api.statsSpecies, {
      isEmpty: (d) => (Array.isArray(d) ? d : d.items).length === 0,
      empty: "所选时间内还没有识别结果",
      render: (d) => renderSpeciesDonut($("chart-species"), Array.isArray(d)
        ? d
        : d.items.map((r) => ({ class_code: r.class_code, box_count: r.count }))),
    });

    loadInto($("chart-trend"), api.statsTrend, {
      isEmpty: (d) => (Array.isArray(d) ? d : d.items).length < 2,
      empty: "数据不足两天，画不出趋势",
      render: (d) => renderTrendLine($("chart-trend"), Array.isArray(d) ? d : d.items),
    });

    loadInto($("chart-quality"), api.statsQuality, {
      isEmpty: (d) => (Array.isArray(d) ? d.length === 0 : d.total === 0),
      empty: "所选时间内还没有采集帧",
      render: (d) => {
        if (Array.isArray(d)) return renderInterceptBars($("chart-quality"), d);
        $("chart-quality").innerHTML = summary(`近 ${d.days} 日共采集 <strong>${d.total}</strong> 帧，拦截
          <strong>${d.rejected}</strong> 帧，拦截率 <strong>${(d.rate * 100).toFixed(1)}%</strong>。按日的柱图需要服务端提供每日数据。`);
      },
    });

    loadInto($("chart-corrections"), api.statsCorrections, {
      isEmpty: (d) => (Array.isArray(d) ? d.length === 0 : d.total === 0),
      empty: "所选时间内还没有人工修正",
      render: (d) => {
        if (Array.isArray(d)) return renderCorrectionStack($("chart-corrections"), d);
        $("chart-corrections").innerHTML = summary(`近 ${d.days} 日：改类别 <strong>${d.modified}</strong>，补框
          <strong>${d.added}</strong>，删框 <strong>${d.rejected}</strong>，共 ${d.total} 处。按类别的分布需要服务端分类统计。`);
      },
    });
  </script>
</body>
</html>
