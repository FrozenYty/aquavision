<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计看板 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>统计看板</h1>
      <div class="av-page-actions">
        <a class="btn btn-primary text-nowrap" href="reports.html">生成巡检报告</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">物种组成 <small class="text-secondary fw-normal">近 7 日检测框</small></h2>
          <div id="chart-species"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">采集量趋势 <small class="text-secondary fw-normal">每日收帧</small></h2>
          <div id="chart-trend"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">质量拦截率 <small class="text-secondary fw-normal">低质量帧占比</small></h2>
          <div id="chart-quality"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="av-card">
          <h2 class="av-card-title">复核修正分布 <small class="text-secondary fw-normal">人工改动汇总</small></h2>
          <div id="chart-corrections"></div>
        </section>
      </div>
    </div>

    <p class="text-secondary small mt-2 mb-0">数字为演示数据，非真实运行结果。</p>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import {
      renderSpeciesDonut,
      renderTrendLine,
      renderInterceptBars,
      renderCorrectionStack,
    } from "../static/js/charts.js";

    renderShell("P-10");

    const $ = (id) => document.getElementById(id);

    (async () => {
      const [species, quality, trend, corrections] = await Promise.all([
        api.statsSpecies(),
        api.statsQuality(),
        api.statsTrend(),
        api.statsCorrections(),
      ]);
      renderSpeciesDonut($("chart-species"), species);
      renderTrendLine($("chart-trend"), trend);
      renderInterceptBars($("chart-quality"), quality);
      renderCorrectionStack($("chart-corrections"), corrections);
    })();
  </script>
</body>
</html>
