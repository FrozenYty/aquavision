<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>识别任务 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>识别任务</h1>
      <div class="av-page-actions">
        <a class="btn btn-outline-primary text-nowrap" href="frames.html">从影像浏览发起批量识别</a>
      </div>
    </div>

    <form class="av-card mb-3 row g-2 align-items-end mx-0" id="filters">
      <div class="col-8 col-md-3">
        <label class="form-label small" for="f-status">状态</label>
        <select class="form-select form-select-sm" id="f-status" name="status">
          <option value="">全部</option><option value="queued">排队中</option><option value="running">运行中</option>
          <option value="done">已完成</option><option value="failed">已失败</option><option value="cancelled">已取消</option>
        </select>
      </div>
      <div class="col-4 col-md-2 d-grid">
        <button class="btn btn-sm btn-outline-primary" type="submit">查询</button>
      </div>
    </form>

    <section class="av-card">
      <h2 class="av-card-title">任务列表 <small class="text-secondary fw-normal" id="live-note"></small></h2>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 small">
          <thead><tr><th>任务</th><th>类型</th><th>帧数</th><th>进度</th><th>状态</th><th>目标数</th><th>模型</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="tasks"></tbody>
        </table>
      </div>
      <div class="av-pager" id="pager"></div>
    </section>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { confirmAction, esc, fmtTime, loadInto, renderPager, toast } from "../static/js/ui.js";

    renderShell("P-05");

    const $ = (id) => document.getElementById(id);
    const POLL_MS = 2000;
    // serializers.TASK_STATUS, glossary §3.
    const STATUS = {
      queued: ["排队中", "secondary"],
      running: ["运行中", "info"],
      done: ["已完成", "success"],
      failed: ["已失败", "danger"],
      cancelled: ["已取消", "dark"],
    };
    let page = 1;
    let timer = null;

    function statusCell(t, queue) {
      const [label, kind] = STATUS[t.status] ?? [t.status, "secondary"];
      const position = t.status === "queued" ? `<div class="text-secondary">排队第 ${queue.indexOf(t.task_id) + 1} 位</div>` : "";
      const error = t.error_msg ? `<div class="text-danger">${esc(t.error_msg)}</div>` : "";
      return `<span class="badge text-bg-${kind}">${label}</span>${position}${error}`;
    }

    function actions(t) {
      if (["queued", "running"].includes(t.status)) return `<button class="btn btn-sm btn-outline-danger" data-act="cancel" data-task="${t.task_id}" data-code="${esc(t.task_code)}" type="button">取消</button>`;
      if (t.status === "failed") return `<button class="btn btn-sm btn-outline-primary" data-act="retry" data-task="${t.task_id}" data-code="${esc(t.task_code)}" type="button">重试</button>`;
      return "";
    }

    function progress(t) {
      return `<div class="d-flex align-items-center gap-2"><div class="progress av-progress flex-grow-1">
        <div class="progress-bar${t.status === "failed" ? " bg-danger" : ""}" style="width: ${t.progress}%"></div></div>
        <span class="av-mono">${t.progress}%</span></div>`;
    }

    function render(data) {
      // Queue order is oldest first; positions are counted over the queued tasks on this page.
      const queue = data.items.filter((t) => t.status === "queued").map((t) => t.task_id).sort((a, b) => a - b);
      $("tasks").innerHTML = data.items.map((t) => `<tr>
        <td class="av-mono">${esc(t.task_code)}</td>
        <td>${t.type === "batch" ? "批量" : "实时"}</td>
        <td class="av-mono">${t.asset_count}</td>
        <td>${progress(t)}</td>
        <td>${statusCell(t, queue)}</td>
        <td class="av-mono">${t.obj_count}</td>
        <td class="av-mono">${t.model_version_id == null ? "—" : `#${t.model_version_id}`}</td>
        <td>${fmtTime(t.created_at)}</td>
        <td>${actions(t)}</td></tr>`).join("");
      renderPager($("pager"), data, (n) => { page = n; load(); });
    }

    // quiet: true for the 2-second refresh, so a list on screen is not replaced by a spinner.
    async function load(quiet = false) {
      clearTimeout(timer);
      const filters = Object.fromEntries(new FormData($("filters")));
      if (!quiet) $("pager").innerHTML = "";
      const data = await loadInto($("tasks"), () => api.listTasks({ ...filters, page, size: 8 }), {
        render,
        quiet,
        isEmpty: (d) => d.items.length === 0,
        empty: '没有符合条件的任务。可以到 <a href="frames.html">影像浏览</a> 选帧发起识别。',
      });
      // Keep polling while anything is still moving; a failed call stops the loop until "重试".
      const moving = data?.items.some((t) => ["queued", "running"].includes(t.status));
      $("live-note").textContent = moving ? "· 每 2 秒刷新进度" : "";
      if (moving) timer = setTimeout(() => load(true), POLL_MS);
    }

    $("tasks").addEventListener("click", async (event) => {
      const btn = event.target.closest("button[data-act]");
      if (!btn) return;
      const { task: id, code } = btn.dataset;
      try {
        if (btn.dataset.act === "cancel") {
          if (!confirmAction(`确定取消任务 ${code}？已识别的帧会保留。`)) return;
          await api.cancelTask(id);
          toast(`任务 ${code} 已取消`, "success");
        } else {
          await api.retryTask(id);
          toast(`任务 ${code} 已重新排队`, "success");
        }
        await load(true);
      } catch (err) {
        toast(err.message, "danger");
      }
    });

    $("filters").addEventListener("submit", (event) => {
      event.preventDefault();
      page = 1;
      load();
    });

    load();
  </script>
</body>
</html>
