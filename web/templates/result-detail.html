<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>结果详情 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>结果详情</h1>
      <div class="av-page-actions">
        <a class="btn btn-outline-secondary text-nowrap" href="capture.html">返回采集</a>
        <a class="btn btn-outline-primary text-nowrap" href="image-browser.html">影像浏览</a>
        <a class="btn btn-primary text-nowrap" id="btn-review" href="review.html">去复核</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-xl-8">
        <section class="av-card">
          <h2 class="av-card-title">叠加结果图 <small class="text-secondary fw-normal av-mono" id="frame-id"></small></h2>
          <div id="stage" class="av-empty">正在载入…</div>
          <div class="small text-secondary mt-2" id="frame-meta"></div>
        </section>
      </div>
      <div class="col-xl-4 d-flex flex-column gap-3">
        <section class="av-card">
          <h2 class="av-card-title">目标列表 <small class="text-secondary fw-normal" id="object-total"></small></h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
              <thead><tr><th>#</th><th>类别</th><th>置信度</th><th>状态</th></tr></thead>
              <tbody id="objects"></tbody>
            </table>
          </div>
        </section>
        <section class="av-card">
          <h2 class="av-card-title">分类计数</h2>
          <ul class="list-unstyled mb-0 d-grid gap-1" id="counts"></ul>
        </section>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { esc, fmtTime, loadInto, qualityBadge } from "../static/js/ui.js";
    import { CLASSES, countByClass, stageHtml, statusBadge } from "../static/js/boxes.js";

    renderShell();

    const $ = (id) => document.getElementById(id);
    function render({ frame, boxes }) {
      $("frame-id").textContent = frame.frame_id;
      $("btn-review").href = `review.html?id=${encodeURIComponent(frame.frame_id)}`;
      $("stage").className = frame.quality.verdict === "ok" ? "" : "is-retake";
      $("stage").innerHTML = stageHtml(frame.image_url, boxes);
      $("frame-meta").innerHTML =
        `${qualityBadge(frame.quality)} 采集于 ${fmtTime(frame.captured_at)} · 会话 ` +
        `<span class="av-mono">${esc(frame.session_id)}</span>` +
        (frame.quality.verdict === "ok" ? "" : " · 需重拍的帧只入库，不做识别");

      $("object-total").textContent = `共 ${boxes.length} 个`;
      $("objects").innerHTML = boxes.length
        ? boxes.map((b) => `<tr data-id="${b.object_id}">
            <td class="av-mono">${b.object_id}</td>
            <td><span class="av-class av-class-${b.class_code}">${CLASSES[b.class_code] ?? esc(b.class_code)}</span></td>
            <td class="av-mono">${b.is_manual ? "人工" : b.confidence.toFixed(2)}</td>
            <td>${statusBadge(b)}</td></tr>`).join("")
        : '<tr><td colspan="4" class="text-secondary">这一帧没有识别结果</td></tr>';

      const counts = countByClass(boxes);
      $("counts").innerHTML = Object.entries(CLASSES).map(([code, name]) =>
        `<li class="d-flex"><span class="av-class av-class-${code}">${name}</span>` +
        `<strong class="ms-auto av-mono">${counts[code]}</strong></li>`).join("");
    }

    // Without ?id= the page opens the newest frame, so the menu entry is never a dead end.
    async function fetchFrame() {
      const id = new URLSearchParams(location.search).get("id")
        ?? (await api.listFrames({ page: 1, size: 1 })).items[0]?.frame_id;
      if (!id) return null;
      const [frame, objects] = await Promise.all([api.getFrame(id), api.getObjects(id)]);
      return { frame, boxes: objects.items };
    }

    loadInto($("stage"), fetchFrame, {
      render,
      isEmpty: (data) => data === null,
      empty: '还没有任何帧。先去 <a href="capture.html">采集控制</a> 采一帧。',
    });

    // Hovering a row lights its box, so list and picture read as one.
    $("objects").addEventListener("mouseover", (event) => {
      const id = event.target.closest("tr")?.dataset.id;
      document.querySelectorAll("#stage .av-box").forEach((el) => el.classList.toggle("is-hot", el.dataset.id === id));
    });

  </script>
</body>
</html>
