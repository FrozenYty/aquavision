<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巡检报告 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>巡检报告</h1>
      <div class="av-page-actions">
        <a class="btn btn-outline-primary text-nowrap" href="stats.html">查看统计分析</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-xl-4">
        <form class="av-card" id="report-form" novalidate>
          <h2 class="av-card-title">生成设置</h2>
          <label class="form-label small" for="period">统计周期</label>
          <select class="form-select form-select-sm mb-2" id="period">
            <option value="week">本周</option><option value="month">本月</option><option value="custom">自定义</option>
          </select>
          <div class="row g-2 mb-2" id="custom-range" hidden>
            <div class="col-6"><input class="form-control form-control-sm" id="from" type="date" aria-label="开始日期"></div>
            <div class="col-6"><input class="form-control form-control-sm" id="to" type="date" aria-label="结束日期">
              <div class="invalid-feedback">结束日期不能早于开始日期</div></div>
          </div>
          <label class="form-label small" for="template">模板</label>
          <select class="form-select form-select-sm mb-2" id="template">
            <option value="standard">标准巡检（物种组成、质量拦截、模型信息）</option>
            <option value="brief">简版（只含物种组成）</option>
          </select>
          <label class="form-label small" for="basis">统计口径</label>
          <select class="form-select form-select-sm mb-3" id="basis">
            <option value="reviewed">复核后结果</option><option value="raw">原始识别结果</option>
          </select>
          <button class="btn btn-primary w-100" id="btn-generate" type="submit">生成报告</button>
        </form>
      </div>
      <div class="col-xl-8">
        <section class="av-card">
          <h2 class="av-card-title">模板预览</h2>
          <article class="av-paper" id="preview"></article>
        </section>
      </div>
      <div class="col-12">
        <section class="av-card">
          <h2 class="av-card-title">历史报告 <small class="text-secondary fw-normal">保留全部版本，可回溯</small></h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
              <thead><tr><th>报告</th><th>周期</th><th>模板</th><th>口径</th><th>模型</th><th>生成时间</th><th>状态</th><th>下载</th></tr></thead>
              <tbody id="history"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { esc, fmtTime, loadInto, toast } from "../static/js/ui.js";
    import { CLASSES } from "../static/js/boxes.js";

    renderShell();

    const $ = (id) => document.getElementById(id);
    const TEMPLATE = { standard: "标准巡检", brief: "简版" };
    const BASIS = { reviewed: "复核后结果", raw: "原始识别结果" };
    // The reports route's status words.
    const STATUS = { ready: ["已生成", "success"], generating: ["生成中", "info"], failed: ["失败", "danger"] };
    let stats = null;

    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

    // Returns { label, from, to } for the chosen period, or null when a custom range is invalid.
    function period() {
      const today = new Date();
      if ($("period").value === "week") {
        const monday = new Date(today);
        monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
        return { label: "本周", from: iso(monday), to: iso(today) };
      }
      if ($("period").value === "month") {
        return { label: `${today.getMonth() + 1} 月`, from: iso(new Date(today.getFullYear(), today.getMonth(), 1)), to: iso(today) };
      }
      const from = $("from").value;
      const to = $("to").value;
      const ok = from && to && from <= to;
      $("to").classList.toggle("is-invalid", Boolean(from && to) && !ok);
      return ok ? { label: `${from} 至 ${to} `, from, to } : null;
    }

    // The server answers /stats/species with { items: [{ class_code, count, share }] } and
    // /stats/quality with totals; the prototype's fixtures still hold per-class and per-day arrays.
    function adapt([species, quality]) {
      const rows = Array.isArray(species)
        ? species.map((r) => ({ class_code: r.class_code, count: r.box_count }))
        : species.items.map((r) => ({ class_code: r.class_code, count: r.count }));
      const totals = Array.isArray(quality)
        ? quality.reduce((t, q) => ({ total: t.total + q.total, rejected: t.rejected + q.intercepted }), { total: 0, rejected: 0 })
        : { total: quality.total, rejected: quality.rejected };
      return { rows, ...totals };
    }

    function renderPreview() {
      if (!stats) return;
      const p = period();
      const all = stats.rows.reduce((sum, r) => sum + r.count, 0);
      const rows = stats.rows.length
        ? stats.rows.map((r) => `<tr><td><span class="av-class av-class-${r.class_code}">${CLASSES[r.class_code] ?? esc(r.class_code)}</span></td>
            <td class="av-mono">${r.count}</td><td class="av-mono">${((r.count / all) * 100).toFixed(1)}%</td></tr>`).join("")
        : '<tr><td colspan="3" class="text-secondary">所选口径下还没有识别结果</td></tr>';
      const standard = $("template").value === "standard";
      const rate = stats.total ? `${((stats.rejected / stats.total) * 100).toFixed(1)}%` : "—";
      $("preview").innerHTML = `
        <h3>${esc(p ? `${p.label}巡检报告` : "巡检报告")}</h3>
        <p class="text-secondary small">统计周期：${p ? `${p.from} 至 ${p.to}` : "请选择有效的日期范围"}</p>
        <h4>一、物种组成</h4>
        <table class="table table-sm small mb-3"><thead><tr><th>物种</th><th>目标数</th><th>占比</th></tr></thead><tbody>${rows}</tbody></table>
        ${standard ? `<h4>二、质量拦截</h4>
        <p class="small">近 7 日共采集 <strong>${stats.total}</strong> 帧，拦截低质量帧 <strong>${stats.rejected}</strong> 帧，
          拦截率 <strong>${rate}</strong>。被拦截的帧只入库、不识别。</p>
        <h4>三、模型信息</h4>
        <p class="small">报告记录生成时的在线模型版本，结果均可追溯到帧、模型版本与参数。</p>` : ""}
        <footer>统计口径：${BASIS[$("basis").value]}${api.USE_MOCK ? " · 数据为演示数据，非真实运行结果" : ""}</footer>`;
    }

    const day = (value) => (value ? value.slice(0, 10) : "—");

    function statusCell(r) {
      const [label, kind] = STATUS[r.status] ?? [r.status, "secondary"];
      return `<span class="badge text-bg-${kind}">${label}</span>${r.error_msg ? `<div class="text-danger">${esc(r.error_msg)}</div>` : ""}`;
    }

    const loadHistory = () => loadInto($("history"), () => api.listReports(), {
      isEmpty: (d) => d.items.length === 0,
      empty: "还没有生成过报告。选好周期后点“生成报告”。",
      render: ({ items }) => {
        $("history").innerHTML = items.map((r) => `<tr>
          <td class="av-mono">${esc(r.report_code)}</td><td class="av-mono">${day(r.period_start)} ~ ${day(r.period_end)}</td>
          <td>${TEMPLATE[r.template] ?? esc(r.template)}</td><td>${BASIS[r.basis] ?? esc(r.basis)}</td>
          <td class="av-mono">${r.model_version_id == null ? "—" : `#${r.model_version_id}`}</td><td>${fmtTime(r.created_at).slice(0, -3)}</td>
          <td>${statusCell(r)}</td>
          <td>${r.status === "ready" ? `<div class="d-flex gap-1" title="${esc(r.file_path ?? "")}"><button class="btn btn-sm btn-outline-secondary" data-format="Word" type="button">Word</button><button class="btn btn-sm btn-outline-secondary" data-format="PDF" type="button">PDF</button></div>` : ""}</td></tr>`).join("");
      },
    });

    $("period").addEventListener("change", () => {
      $("custom-range").hidden = $("period").value !== "custom";
      renderPreview();
    });
    ["from", "to", "template", "basis"].forEach((id) => $(id).addEventListener("change", renderPreview));

    $("report-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const p = period();
      if (!p) return toast("请先选好有效的日期范围", "warning");
      $("btn-generate").disabled = true;
      try {
        const report = await api.createReport({
          period_start: `${p.from}T00:00:00+08:00`,
          period_end: `${p.to}T23:59:59+08:00`,
          template: $("template").value,
          basis: $("basis").value,
        });
        toast(`报告 ${report.report_code} 已生成`, "success");
        await loadHistory();
      } catch (err) {
        toast(err.message, "danger");
      } finally {
        $("btn-generate").disabled = false;
      }
    });

    $("history").addEventListener("click", (event) => {
      const format = event.target.closest("[data-format]")?.dataset.format;
      if (format) toast(`报告文件已在服务端生成；${format} 格式的下载还没有接口`, "info");
    });

    loadInto($("preview"), () => Promise.all([api.statsSpecies(), api.statsQuality()]), {
      isEmpty: () => false,
      empty: "",
      render: (data) => {
        stats = adapt(data);
        renderPreview();
      },
    });
    loadHistory();
  </script>
</body>
</html>
