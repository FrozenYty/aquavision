<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人工复核 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>人工复核</h1>
      <div class="av-page-actions">
        <a class="btn btn-outline-secondary text-nowrap" id="btn-back" href="image-browser.html">返回结果详情</a>
        <button class="btn btn-primary text-nowrap" id="btn-submit" type="button">提交复核</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-xl-8">
        <section class="av-card">
          <div class="av-toolbar mb-3">
            <div class="btn-group btn-group-sm" role="group" aria-label="工具">
              <button class="btn btn-outline-primary active" id="tool-select" type="button" title="选择并拖动框（V）">选择</button>
              <button class="btn btn-outline-primary" id="tool-draw" type="button" title="在画面上拖出新框（B）">画框</button>
              <button class="btn btn-outline-primary" id="tool-delete" type="button" title="删除选中的框（Delete）">删除</button>
              <button class="btn btn-outline-primary" id="tool-undo" type="button" title="撤销上一步" disabled>撤销</button>
            </div>
            <select class="form-select form-select-sm w-auto" id="class-select" aria-label="类别"></select>
            <div class="btn-group btn-group-sm" role="group" aria-label="缩放">
              <button class="btn btn-outline-secondary" id="zoom-out" type="button" title="缩小（-）" aria-label="缩小">−</button>
              <button class="btn btn-outline-secondary av-mono" id="zoom-reset" type="button" title="回到适应宽度（0）">100%</button>
              <button class="btn btn-outline-secondary" id="zoom-in" type="button" title="放大（+）" aria-label="放大">+</button>
            </div>
            <span class="ms-auto small">计数 <strong class="av-mono" id="count-change">—</strong></span>
          </div>
          <div id="viewport" class="av-empty">正在载入…</div>
          <div class="small text-secondary mt-2">选中框后拖动可移动，拖四角手柄可调整大小；改类别用上方下拉框。按住 Ctrl 滚动滚轮缩放；拖动中按 Esc 撤回这一次拖动。</div>
        </section>
      </div>
      <div class="col-xl-4">
        <section class="av-card">
          <h2 class="av-card-title">目标列表
            <button class="btn btn-sm btn-outline-primary ms-auto text-nowrap" id="btn-add" type="button">新增</button></h2>
          <div class="av-mono small text-secondary mb-2" id="frame-id"></div>
          <ul class="list-unstyled mb-0 d-grid gap-1" id="objects"></ul>
        </section>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { confirmAction, loadInto, toast } from "../static/js/ui.js";
    import { CLASSES, boxHtml, pictureHtml, statusBadge } from "../static/js/boxes.js";
    import { MIN_BOX, ZOOM_STEPS, anchorScroll, drawBox, moveBox, nextZoom, resizeBox, toImageCoords }
      from "../static/js/canvas.js";

    renderShell();

    const $ = (id) => document.getElementById(id);
    const MODIFIED = 2;
    const CONFIRMED = 1;
    const HANDLES = ["nw", "ne", "sw", "se"];

    let frameId = null;
    let imageUrl = "";
    let objects = [];
    let initialCount = 0;
    let selected = null;
    let mode = "select";
    let previous = null; // one step of undo, not a stack (prototype §3)
    let zoom = 1;
    // The gesture in progress: { id, kind: "draw" | "move" | a corner, start, from, undoBefore, moved }.
    let drag = null;

    $("class-select").innerHTML = Object.entries(CLASSES)
      .map(([code, name]) => `<option value="${code}">${name}</option>`).join("");

    const find = (id) => objects.find((o) => o.object_id === id);
    const stage = () => $("canvas");

    function remember() {
      previous = structuredClone(objects);
      $("tool-undo").disabled = false;
    }

    // Only the box layer is redrawn; the picture stays put, so it never reloads mid-drag and never has
    // a zero height at the moment a pointer position is read.
    function render() {
      if (!$("box-layer")) return;
      stage().classList.toggle("is-drawing", mode === "draw");
      $("box-layer").innerHTML = objects.map(boxHtml).join("");
      const box = selected && $("box-layer").querySelector(`.av-box[data-id="${selected}"]`);
      if (box) {
        box.classList.add("is-selected");
        box.insertAdjacentHTML("beforeend", HANDLES.map((h) => `<span class="av-handle" data-h="${h}"></span>`).join(""));
      }
      $("count-change").textContent = `${initialCount} → ${objects.length}`;
      $("objects").innerHTML = objects.map((o) => `
        <li class="av-object-row${o.object_id === selected ? " is-selected" : ""}" data-id="${o.object_id}">
          <span class="av-class av-class-${o.class_code}">${CLASSES[o.class_code]}</span>
          <span class="av-mono small">${o.is_manual ? "人工" : o.confidence.toFixed(2)}</span>
          ${statusBadge(o)}
          <span class="ms-auto d-flex gap-1">
            <button class="btn btn-sm btn-outline-success" data-act="confirm" type="button">确认</button>
            <button class="btn btn-sm btn-outline-danger" data-act="delete" type="button">删除</button>
          </span>
        </li>`).join("") || '<li class="text-secondary small">没有目标，用“画框”新增。</li>';
    }

    function select(id) {
      selected = id;
      if (id) $("class-select").value = find(id).class_code;
      render();
    }

    function setMode(next) {
      mode = next;
      $("tool-select").classList.toggle("active", mode === "select");
      $("tool-draw").classList.toggle("active", mode === "draw");
      render();
    }

    function removeSelected() {
      if (!selected || drag) return; // not while a box is being dragged
      // Deleting is destructive for the reviewer's session, so it asks first (SRS §5.1).
      if (!confirmAction("删除选中的框？提交复核后，这一框会被标为已驳回。")) return;
      remember();
      objects = objects.filter((o) => o.object_id !== selected);
      selected = null;
      render();
    }

    // The picture counts as there only once it has decoded: before that the stage may still have a
    // height (a broken-image strip, say) but it is not the frame, so a box drawn on it would be wrong.
    // Without an image the placeholder has its own 16:9 size and is ready at once.
    function pictureReady() {
      const img = stage()?.querySelector("img");
      return Boolean(stage()) && (!img || (img.complete && img.naturalWidth > 0));
    }

    // Pointer position in normalised image coordinates, or null while the picture is not ready.
    function point(event) {
      if (!pictureReady()) return null;
      return toImageCoords(event.clientX, event.clientY, stage().getBoundingClientRect());
    }

    // ---- Zoom: the stage's width changes inside the scrolling viewport ----
    function setZoom(next, anchor) {
      if (!stage() || drag) return; // a zoom mid-gesture would move the picture under the pointer
      const level = Math.min(ZOOM_STEPS.at(-1), Math.max(ZOOM_STEPS[0], next));
      const view = $("viewport").getBoundingClientRect();
      const at = anchor ?? { x: view.left + view.width / 2, y: view.top + view.height / 2 };
      const before = stage().getBoundingClientRect();
      zoom = level;
      stage().style.width = `${zoom * 100}%`;
      const { dx, dy } = anchorScroll(at.x, at.y, before, stage().getBoundingClientRect());
      $("viewport").scrollLeft += dx;
      $("viewport").scrollTop += dy;
      $("zoom-reset").textContent = `${Math.round(zoom * 100)}%`;
      $("zoom-in").disabled = zoom >= ZOOM_STEPS.at(-1);
      $("zoom-out").disabled = zoom <= ZOOM_STEPS[0];
    }

    $("zoom-in").onclick = () => setZoom(nextZoom(zoom, 1));
    $("zoom-out").onclick = () => setZoom(nextZoom(zoom, -1));
    $("zoom-reset").onclick = () => setZoom(1);

    // Ctrl + wheel (a trackpad pinch arrives as one) zooms at the pointer; a plain wheel scrolls.
    $("viewport").addEventListener("wheel", (event) => {
      if (!event.ctrlKey || !stage()) return;
      event.preventDefault();
      setZoom(nextZoom(zoom, event.deltaY < 0 ? 1 : -1), { x: event.clientX, y: event.clientY });
    }, { passive: false });

    // ---- Gestures ----
    // Puts the boxes back as they were when the gesture began, and the undo step with them.
    function cancelDrag() {
      if (!drag) return;
      const kind = drag.kind;
      objects = previous;
      previous = drag.undoBefore;
      $("tool-undo").disabled = !previous;
      drag = null;
      if (kind === "draw") {
        selected = null;
        return setMode("select");
      }
      render();
    }

    $("viewport").addEventListener("pointerdown", (event) => {
      if (drag || event.button !== 0) return; // one gesture at a time
      const p = point(event);
      if (!frameId || !p) return; // nothing loaded yet: ignore rather than guess
      const undoBefore = previous;
      if (mode === "draw") {
        if (!event.target.closest("#canvas")) return; // a new box starts on the picture, not beside it
        remember();
        const id = Math.max(0, ...objects.map((o) => o.object_id)) + 1;
        objects.push({ object_id: id, class_code: $("class-select").value, confidence: 1, is_manual: 1,
          review_status: MODIFIED, x: p.x, y: p.y, w: 0, h: 0 });
        drag = { id, kind: "draw", start: p, undoBefore, moved: false };
        selected = id;
      } else {
        const boxEl = event.target.closest(".av-box");
        if (!boxEl) return select(null);
        const id = Number(boxEl.dataset.id);
        if (id !== selected) select(id);
        remember();
        drag = { id, kind: event.target.dataset.h ?? "move", start: p, from: { ...find(id) }, undoBefore, moved: false };
      }
      $("viewport").setPointerCapture(event.pointerId);
    });

    $("viewport").addEventListener("pointermove", (event) => {
      if (!drag) return;
      const p = point(event);
      if (!p) return;
      const o = find(drag.id);
      const dx = p.x - drag.start.x;
      const dy = p.y - drag.start.y;
      if (drag.kind === "draw") Object.assign(o, drawBox(drag.start, p));
      else if (drag.kind === "move") Object.assign(o, moveBox(drag.from, dx, dy));
      else Object.assign(o, resizeBox(drag.from, drag.kind, dx, dy)); // a corner handle
      o.review_status = MODIFIED;
      drag.moved = true;
      render();
    });

    $("viewport").addEventListener("pointerup", () => {
      if (!drag) return;
      if (drag.kind === "draw") {
        const o = find(drag.id);
        if (o.w < MIN_BOX || o.h < MIN_BOX) return cancelDrag(); // a click, not a drag: no box
        drag = null;
        return setMode("select");
      }
      // A click on a box selects it; that is not an edit, so it does not spend the undo step.
      if (!drag.moved) {
        objects = previous;
        previous = drag.undoBefore;
        $("tool-undo").disabled = !previous;
      }
      drag = null;
      render();
    });
    $("viewport").addEventListener("pointercancel", cancelDrag);

    $("objects").addEventListener("click", (event) => {
      if (drag) return;
      const row = event.target.closest(".av-object-row");
      if (!row) return;
      const id = Number(row.dataset.id);
      const act = event.target.dataset.act;
      if (act === "delete") { selected = id; return removeSelected(); }
      if (act === "confirm") { remember(); find(id).review_status = CONFIRMED; }
      select(id);
    });

    $("class-select").addEventListener("change", () => {
      if (!selected || drag) return;
      remember();
      Object.assign(find(selected), { class_code: $("class-select").value, review_status: MODIFIED });
      render();
    });

    $("tool-select").onclick = () => setMode("select");
    $("tool-draw").onclick = () => { selected = null; setMode("draw"); };
    $("btn-add").onclick = $("tool-draw").onclick;
    $("tool-delete").onclick = removeSelected;
    $("tool-undo").onclick = () => {
      if (drag || !previous) return;
      objects = previous;
      previous = null;
      selected = null;
      $("tool-undo").disabled = true;
      render();
    };

    document.addEventListener("keydown", (event) => {
      if (event.target instanceof Element && event.target.closest("select, input")) return;
      if (event.key === "Escape") {
        // Esc takes back the gesture in progress; otherwise it leaves the draw tool, then the selection.
        if (drag) return cancelDrag();
        if (mode === "draw") return setMode("select");
        return select(null);
      }
      if (drag) return; // every other key waits until the gesture ends
      if (event.key === "Delete" || event.key === "Backspace") removeSelected();
      if (event.key === "v") setMode("select");
      if (event.key === "b") { selected = null; setMode("draw"); }
      if (event.key === "+" || event.key === "=") setZoom(nextZoom(zoom, 1));
      if (event.key === "-") setZoom(nextZoom(zoom, -1));
      if (event.key === "0") setZoom(1);
    });

    // The box list is what the server stored after the submit, not what the page last held: the server
    // assigns object ids to new boxes and sets the count, so both come back from it.
    // Rejected boxes stay in the store for traceability (AC-15) but are not part of the working set.
    async function reloadBoxes() {
      const data = await api.getObjects(frameId);
      objects = data.items.filter((box) => box.review_status !== 3);
      selected = null;
      previous = null;
      $("tool-undo").disabled = true;
    }

    $("btn-submit").onclick = async () => {
      if (drag) return;
      const button = $("btn-submit");
      button.disabled = true;
      try {
        const result = await api.submitReview(frameId, objects);
        const before = initialCount;
        await reloadBoxes();
        // The count is the server's: its object_count, not the length of anything this page holds.
        initialCount = result.object_count;
        toast(`复核已提交（第 ${result.version_no} 版），计数 ${before} → ${initialCount}`, "success");
        render();
      } catch (err) {
        toast(err.message, "danger");
      } finally {
        button.disabled = false;
      }
    };

    // Without ?id= the page opens the newest frame, so the menu entry is never a dead end.
    async function fetchFrame() {
      const id = new URLSearchParams(location.search).get("id")
        ?? (await api.listFrames({ page: 1, size: 1 })).items[0]?.frame_id;
      if (!id) return null;
      const [frame, data] = await Promise.all([api.getFrame(id), api.getObjects(id)]);
      return { frame, boxes: data.items };
    }

    loadInto($("viewport"), fetchFrame, {
      isEmpty: (data) => data === null,
      empty: '还没有任何帧可以复核。先去 <a href="capture.html">采集控制</a> 采一帧。',
      render: ({ frame, boxes: all }) => {
        frameId = frame.frame_id;
        imageUrl = frame.image_url ?? "";
        $("viewport").className = "av-viewport";
        $("viewport").innerHTML = `<div id="canvas" class="av-stage is-editing">${pictureHtml(imageUrl)}` +
          '<div id="box-layer" class="av-box-layer"></div></div>';
        // A picture that fails to load gives way to the placeholder, so the boxes can still be reviewed.
        stage().querySelector("img")?.addEventListener("error", (event) => {
          event.target.outerHTML = pictureHtml("");
          toast("帧画面加载失败，检测框按坐标画在占位区域上", "warning");
        }, { once: true });
        const boxes = all.filter((box) => box.review_status !== 3); // rejected boxes are kept, not shown
        objects = boxes;
        initialCount = boxes.length;
        $("frame-id").textContent = frame.frame_id;
        $("btn-back").href = `result-detail.html?id=${encodeURIComponent(frame.frame_id)}`;
        setZoom(1);
        // Open on the box most likely to be wrong: the lowest confidence.
        const doubtful = [...boxes].sort((a, b) => a.confidence - b.confidence)[0];
        select(doubtful?.object_id ?? null);
      },
    });
  </script>
</body>
</html>
