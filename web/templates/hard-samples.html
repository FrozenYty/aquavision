<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>难例样本 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>难例样本</h1>
      <div class="av-page-actions">
        <a class="btn btn-outline-primary text-nowrap" href="review.html">去人工复核</a>
      </div>
    </div>

    <form class="av-card mb-3 row g-2 align-items-end mx-0" id="filters">
      <div class="col-8 col-md-3">
        <label class="form-label small" for="f-source">来源</label>
        <select class="form-select form-select-sm" id="f-source" name="source"></select>
      </div>
      <div class="col-4 col-md-2 d-grid">
        <button class="btn btn-sm btn-outline-primary" type="submit">查询</button>
      </div>
    </form>

    <section class="av-card">
      <h2 class="av-card-title">难例 <small class="text-secondary fw-normal">低置信、复核时修改过、跨模型不一致的帧，导出数据集时可一并纳入</small></h2>
      <div class="row g-3" id="grid"></div>
      <div class="av-pager" id="pager"></div>
    </section>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { confirmAction, esc, fmtTime, loadInto, qualityBadge, renderPager, toast } from "../static/js/ui.js";

    renderShell();

    const $ = (id) => document.getElementById(id);
    // The server's source codes (FR-M4-03).
    const HARD_SOURCES = { low_conf: "低置信", modified: "复核修改", inconsistent: "跨模型不一致" };
    const KIND = { low_conf: "warning", modified: "info", inconsistent: "danger" };
    let page = 1;

    $("f-source").innerHTML = '<option value="">全部</option>' +
      Object.entries(HARD_SOURCES).map(([code, name]) => `<option value="${code}">${name}</option>`).join("");

    // Real frames carry no picture URL yet; they keep the placeholder tile.
    const thumbStyle = (h) => (h.image_url ? ` style="background: center / cover no-repeat url('${esc(h.image_url)}')"` : "");

    function render(data) {
      $("grid").innerHTML = data.items.map((h) => `
        <div class="col-6 col-md-4 col-xl-3">
          <div class="av-thumb">
            <div class="av-thumb-img"${thumbStyle(h)}></div>
            <span class="badge text-bg-${KIND[h.source] ?? "secondary"}">${HARD_SOURCES[h.source] ?? esc(h.source)}</span>
            <div class="av-thumb-meta">
              <div class="av-mono text-truncate">${esc(h.frame_id)}</div>
              <div>${h.quality ? qualityBadge(h.quality) : ""} ${h.captured_at ? fmtTime(h.captured_at).slice(5, 15) : ""}</div>
              <div class="d-flex gap-1 mt-2">
                <a class="btn btn-sm btn-outline-secondary" href="result-detail.html?id=${encodeURIComponent(h.frame_id)}">查看</a>
                <button class="btn btn-sm btn-outline-danger" data-frame="${esc(h.frame_id)}" type="button">移出</button>
              </div>
            </div>
          </div>
        </div>`).join("");
      renderPager($("pager"), data, (n) => { page = n; load(); });
    }

    function load() {
      const filters = Object.fromEntries(new FormData($("filters")));
      $("pager").innerHTML = "";
      return loadInto($("grid"), () => api.listHardSamples({ ...filters, page, size: 8 }), {
        render,
        isEmpty: (data) => data.items.length === 0,
        empty: '没有符合条件的难例。复核时修改过的帧会自动进入这里，去 <a href="review.html">人工复核</a> 看看。',
      });
    }

    $("grid").addEventListener("click", async (event) => {
      const id = event.target.closest("button[data-frame]")?.dataset.frame;
      if (!id || !confirmAction(`把帧 ${id} 移出难例样本？之后导出数据集不再包含它。`)) return;
      try {
        await api.removeHardSample(id);
        toast("已移出难例样本", "success");
        await load();
      } catch (err) {
        toast(err.message, "danger");
      }
    });

    $("filters").addEventListener("submit", (event) => {
      event.preventDefault();
      page = 1;
      load();
    });

    load();
  </script>
</body>
</html>
