<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>采集控制 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-content">
    <div class="av-page-header">
      <h1>采集控制</h1>
      <div class="av-page-actions">
        <select class="form-select w-auto" id="site" aria-label="点位">
          <option value="A3">点位 A3</option><option value="B1">点位 B1</option>
        </select>
        <button class="btn btn-primary text-nowrap" id="btn-open" type="button">开始采集</button>
        <button class="btn btn-outline-secondary text-nowrap" id="btn-close" type="button" disabled>结束采集</button>
        <button class="btn btn-outline-primary text-nowrap" id="btn-webcam" type="button">试一下本机摄像头</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-xl-8">
        <section class="av-card" id="frame-card">
          <h2 class="av-card-title">实时画面 <small class="text-secondary fw-normal" id="camera"></small><span class="av-live">REC</span></h2>
          <div class="av-live-view">
            <div id="live" class="av-empty">点击“开始采集”，画面与识别结果会在这里逐帧出现。</div>
            <video id="webcam" class="av-webcam" autoplay muted playsinline hidden></video>
            <span class="av-latency" id="latency" hidden></span>
          </div>
          <div class="small text-secondary mt-2" id="feed-mode"></div>
          <div class="d-flex flex-wrap gap-3 small text-secondary mt-1">
            <span id="frame-meta">—</span>
            <span class="ms-auto" id="source-note"></span>
          </div>
        </section>
      </div>
      <div class="col-xl-4 d-flex flex-column gap-3">
        <section class="av-card">
          <h2 class="av-card-title">质量分</h2>
          <div class="d-flex align-items-center gap-4">
            <svg class="av-ring" id="q-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="52" class="av-ring-track"></circle>
              <circle cx="60" cy="60" r="52" class="av-ring-value" pathLength="100" stroke-dasharray="0 100"></circle>
            </svg>
            <div>
              <div class="av-kpi-value" id="q-score">—</div>
              <div class="small" id="q-verdict">等待第一帧</div>
            </div>
          </div>
          <div class="d-grid gap-2 mt-3" id="q-meters"></div>
        </section>
        <section class="av-card">
          <h2 class="av-card-title">本帧计数 <small class="text-secondary fw-normal" id="count-total"></small></h2>
          <ul class="list-unstyled mb-0 d-grid gap-1" id="counts"></ul>
        </section>
      </div>

      <div class="col-12">
        <section class="av-card">
          <h2 class="av-card-title">最近帧 <small class="text-secondary fw-normal">点一帧查看识别结果</small></h2>
          <div class="av-strip" id="strip"><div class="av-empty w-100">开始采集后，最近的帧会排在这里。</div></div>
        </section>
      </div>

      <div class="col-12">
        <section class="av-card">
          <h2 class="av-card-title">采集会话</h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
              <thead><tr><th>会话</th><th>点位</th><th>开始时间</th><th>帧数</th><th>需重拍</th><th>状态</th><th>失败原因</th></tr></thead>
              <tbody id="sessions"></tbody>
            </table>
          </div>
          <div class="av-pager" id="pager"></div>
        </section>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderShell } from "../static/js/layout.js";
    import * as api from "../static/js/api.js";
    import { esc, fmtTime, loadInto, renderPager, toast } from "../static/js/ui.js";
    import { CLASSES, countByClass, stageHtml } from "../static/js/boxes.js";
    import { openFeed } from "../static/js/live.js";

    renderShell("P-03");

    const $ = (id) => document.getElementById(id);
    const STATUS = {
      open: '<span class="badge text-bg-info">采集中</span>',
      closed: '<span class="badge text-bg-secondary">已结束</span>',
      failed: '<span class="badge text-bg-danger">失败</span>',
    };
    const MODE = {
      mock: "演示数据",
      socket: "实时连接 /ws/capture",
      polling: "实时连接不可用，已改为每秒轮询最新帧",
      closed: "实时连接已断开",
    };
    let current = null;
    let page = 1;
    let stopFeed = null;
    let stream = null;
    let frame = {}; // what is on screen now, merged from the feed's updates

    // The server derives sessions from frames (frames, retakes); the prototype's fixtures add a site,
    // a status and a failure reason. Either renders.
    const loadSessions = (quiet = false) => loadInto($("sessions"), () => api.listSessions({ page, size: 5 }), {
      quiet,
      isEmpty: (d) => d.items.length === 0,
      empty: "还没有采集会话。点“开始采集”打开第一个。",
      render: (data) => {
        $("sessions").innerHTML = data.items.map((s) => `<tr>
          <td class="av-mono">${esc(s.session_id)}</td><td>${esc(s.site ?? "—")}</td>
          <td>${fmtTime(s.started_at)}</td><td>${s.frames ?? s.frame_count}</td><td>${s.retakes ?? s.retake_count}</td>
          <td>${s.status ? STATUS[s.status] ?? esc(s.status) : "—"}</td><td class="text-danger">${esc(s.fail_reason ?? "")}</td></tr>`).join("");
        renderPager($("pager"), data, (n) => { page = n; loadSessions(); });
      },
    });

    const meter = (label, v) => `<div class="av-meter${v < 60 ? " is-low" : ""}">
      <span>${label}</span><div class="av-meter-bar"><span style="--v: ${v}"></span></div><strong>${Math.round(v)}</strong></div>`;

    function renderQuality(q, components) {
      const low = q.verdict !== "ok";
      $("q-ring").classList.toggle("is-low", low);
      $("q-ring").querySelector(".av-ring-value").setAttribute("stroke-dasharray", `${q.score} 100`);
      $("q-score").textContent = q.score;
      $("q-verdict").innerHTML = low
        ? '<span class="badge text-bg-warning">需重拍</span> 低于 60，入库但不识别'
        : '<span class="badge text-bg-success">合格</span> 已送入识别';
      // The three components exist only at capture time (api-contract §6); a stored frame has the score.
      $("q-meters").innerHTML = components?.sharpness !== undefined
        ? meter("清晰度", components.sharpness) + meter("亮度", components.brightness) + meter("色偏", components.colorcast)
        : '<div class="small text-secondary">分项只在采集当时返回，已入库的帧只保留总分</div>';
    }

    function renderCounts(boxes) {
      const counts = countByClass(boxes);
      $("count-total").textContent = `共 ${boxes.length} 个目标`;
      $("counts").innerHTML = Object.entries(CLASSES).map(([code, name]) =>
        `<li class="d-flex"><span class="av-class av-class-${code}">${name}</span>` +
        `<strong class="ms-auto av-mono">${counts[code]}</strong></li>`).join("");
    }

    function addToStrip(f) {
      const strip = $("strip");
      strip.querySelector(".av-empty")?.remove();
      const retake = f.quality?.verdict === "retake";
      const thumb = f.image_url ? `<img src="${esc(f.image_url)}" alt="">` : '<span class="av-strip-blank"></span>';
      strip.insertAdjacentHTML("afterbegin", `
        <a class="av-strip-item${retake ? " is-retake" : ""}" href="frame.html?id=${encodeURIComponent(f.frame_id)}">
          ${thumb}<span class="av-mono">${esc(f.frame_id.slice(-9))}</span>
          <span>${f.quality ? (retake ? "需重拍" : `质量 ${f.quality.score}`) : "—"}</span>
        </a>`);
      while (strip.children.length > 8) strip.lastElementChild.remove();
    }

    // One update in, every reading out: picture, boxes, quality, counts, strip and latency.
    function applyUpdate(update) {
      if (update.latency_ms !== undefined) $("latency").textContent = `延迟 ${update.latency_ms} ms`;
      else if (update.age_ms !== undefined) $("latency").textContent = `距采集 ${(update.age_ms / 1000).toFixed(1)} s`;
      if (!("boxes" in update)) return;

      const fresh = update.frame_id && update.frame_id !== frame.frame_id;
      frame = { ...frame, ...Object.fromEntries(Object.entries(update).filter(([, v]) => v !== undefined)) };
      $("live").className = frame.quality?.verdict === "retake" ? "is-retake" : "";
      $("live").innerHTML = stageHtml(frame.image_url, frame.boxes ?? []);
      if (frame.frame_id) {
        $("frame-meta").innerHTML = `<span class="av-mono">${esc(frame.frame_id)}</span>${frame.captured_at ? ` · ${fmtTime(frame.captured_at)}` : ""}`;
      }
      if (frame.quality) renderQuality(frame.quality, frame.components);
      renderCounts(frame.boxes ?? []);
      if (fresh) {
        addToStrip(frame);
        loadSessions(true);
      }
    }

    function onState(kind, detail) {
      if (kind === "status") {
        $("feed-mode").textContent = `${MODE.socket} · ${detail.fps} fps · 队列 ${detail.queue} · 模型 ${detail.model}`;
        return;
      }
      $("feed-mode").textContent = MODE[kind] ?? kind;
      if (kind === "polling" || kind === "socket") {
        $("live").className = "";
        $("live").innerHTML = '<div class="av-state" role="status"><span class="spinner-border spinner-border-sm"></span> 等待第一帧…</div>';
      }
    }

    function setRunning(running) {
      $("frame-card").classList.toggle("is-live", running);
      $("btn-open").disabled = running;
      $("site").disabled = running;
      $("btn-close").disabled = !running;
      $("latency").hidden = !running;
    }

    async function startSession() {
      if (stream) await toggleWebcam();
      current = await api.openSession({ site: $("site").value, camera_index: 0 });
      frame = {};
      setRunning(true);
      stopFeed = await openFeed(current.session_id, applyUpdate, onState, (err) => toast(err.message, "danger"));
    }

    async function stopSession() {
      if (!current) return;
      stopFeed?.();
      stopFeed = null;
      setRunning(false);
      $("feed-mode").textContent = "";
      try {
        await api.closeSession(current.session_id);
        toast(`会话 ${current.session_id} 已结束`, "success");
      } catch (err) {
        // The server keeps no session table: closing one that never received a frame is a 404.
        toast(err.code === 40401 ? `会话 ${current.session_id} 没有收到任何帧，已结束` : err.message, err.code === 40401 ? "info" : "danger");
      }
      current = null;
      await loadSessions();
    }

    // The laptop camera proves frames can come from a device; no boxes in this mode (prototype §4).
    async function toggleWebcam() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
        $("webcam").hidden = true;
        $("live").hidden = false;
        $("btn-webcam").textContent = "试一下本机摄像头";
        return;
      }
      await stopSession();
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      $("webcam").srcObject = stream;
      $("webcam").hidden = false;
      $("live").hidden = true;
      $("btn-webcam").textContent = "返回样张";
      $("frame-meta").textContent = "本机摄像头实时画面，此模式不叠加目标框";
    }

    $("btn-open").onclick = () => startSession().catch((err) => { toast(err.message, "danger"); setRunning(false); });
    $("btn-close").onclick = () => stopSession();
    $("btn-webcam").onclick = () => toggleWebcam().catch(() => toast("无法打开本机摄像头，请检查浏览器权限", "danger"));

    renderCounts([]);
    $("count-total").textContent = "";
    $("source-note").textContent = api.USE_MOCK
      ? "影像来自 DUO 公开数据集样张；正式版由 USB 摄像头实时供帧"
      : "影像由采集端的 USB 摄像头提供";
    // The server lists cameras as { items }; the prototype's fixture is a bare list.
    api.listCameras()
      .then((d) => {
        const [camera] = Array.isArray(d) ? d : d.items;
        $("camera").textContent = camera ? `· ${camera.name}` : "· 未检测到摄像头";
      })
      .catch(() => { $("camera").textContent = "· 无法读取摄像头列表"; });
    loadSessions();
  </script>
</body>
</html>
