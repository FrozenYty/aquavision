<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · AquaVision</title>
  <link rel="stylesheet" href="../static/vendor/bootstrap-5.3.3/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/tokens.css">
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <main class="av-login">
    <section class="av-login-hero av-reveal">
      <div class="av-brand">
        <span class="av-brand-mark" aria-hidden="true"></span>
        <span class="av-brand-name">AQUAVISION</span>
        <small>水下物种识别与监测</small>
      </div>
      <h1>看清水下的<br>每一个生命</h1>
      <p>摄像头采集，质量把关，YOLOv8 识别，人工复核回流。每一条结果都能追溯到帧、模型版本与参数。</p>
      <div class="mt-4">
        <span class="av-class av-class-holothurian">海参</span>
        <span class="av-class av-class-strongylocentrotus">海胆</span>
        <span class="av-class av-class-chlamys">扇贝</span>
        <span class="av-class av-class-asterias">海星</span>
      </div>
    </section>

    <form class="av-login-card av-reveal" id="login-form" style="--i: 2" novalidate>
      <h2 class="h5 fw-bold mb-1">登录</h2>
      <p class="text-secondary small mb-4">使用分配的账号进入系统</p>

      <div class="mb-3">
        <label class="form-label" for="account">账号、手机号或邮箱</label>
        <input class="form-control" id="account" name="account" autocomplete="username" required>
        <div class="invalid-feedback">请输入账号</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">密码</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" required>
        <div class="invalid-feedback">请输入密码</div>
      </div>

      <div class="alert alert-danger small py-2" id="login-error" role="alert" hidden></div>
      <button class="btn btn-primary w-100" id="btn-login" type="submit">登录</button>
      <p class="small text-secondary mt-3 mb-0" id="login-hint">忘记密码请联系管理员在“系统设置”中重置。</p>
    </form>
  </main>

  <script type="module">
    import * as api from "../static/js/api.js";

    const $ = (id) => document.getElementById(id);
    const form = $("login-form");

    // Only a bare page name is accepted as the destination, never a URL.
    const next = new URLSearchParams(location.search).get("next") ?? "";
    const target = /^[a-z-]+\.html(\?[\w=&%.-]*)?$/.test(next) ? next : "home.html";

    if (api.USE_MOCK) $("login-hint").textContent = "演示模式：任意账号和密码都能登录，数据为模拟数据。";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      form.classList.add("was-validated");
      $("login-error").hidden = true;
      if (!form.checkValidity()) return;
      $("btn-login").disabled = true;
      $("btn-login").textContent = "登录中…";
      try {
        api.saveSession(await api.login($("account").value.trim(), $("password").value));
        location.href = target;
      } catch (err) {
        // The server's own words: they carry the attempts left and the lockout time (AC-01).
        $("login-error").textContent = err.message;
        $("login-error").hidden = false;
        form.classList.remove("was-validated"); // the server spoke; an empty-field hint would only add noise
        $("password").value = "";
        $("password").focus();
      } finally {
        $("btn-login").disabled = false;
        $("btn-login").textContent = "登录";
      }
    });
  </script>
</body>
</html>
