name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A push caused by GITHUB_TOKEN does not start a workflow, and merges are performed by the
  # auto-merge bot holding exactly that token. So the post-merge run on main silently never happens
  # for bot-merged pull requests, and a change that passed its own PR but breaks an earlier one would
  # go unnoticed. This schedule is the backstop: it needs no secret and cannot expire.
  schedule:
    - cron: "0 4 * * *"  # 12:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message check reads every commit in the pull request, not only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # One source of truth: requirements-server.txt was written down because CI used to mirror
          # this list by hand (ADR 11). Installing the file means a version bump is exercised here,
          # and ruff and pytest are pinned by it too.
          python -m pip install -r requirements-server.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Bilingual documents in sync
        run: python scripts/check-bilingual.py

      - name: No Chinese in English documents
        run: python scripts/check-language.py

      - name: Progress log well formed
        run: python scripts/check-progress.py

      - name: No machine-specific paths
        run: python scripts/check-paths.py

      - name: Every decision record is listed
        run: python scripts/check-adr-index.py

      - name: Acceptance coverage
        run: python scripts/check-ac-coverage.py

      - name: No tool is credited as a co-author
        if: github.event_name == 'pull_request'
        run: python scripts/check-commit-messages.py --range "origin/${{ github.base_ref }}..HEAD"

      - name: Tests
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            pytest -q
          else
            echo "no tests yet"
          fi

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ESP32 toolchain is about a gigabyte. Caching it turns a five-minute job into a one-minute
      # job; the key follows platformio.ini, so a platform bump rebuilds it once and then caches again.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/main/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build the rig controller
        working-directory: firmware/main
        run: pio run

