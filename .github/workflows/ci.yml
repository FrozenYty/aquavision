name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Bilingual documents in sync
        run: python scripts/check-bilingual.py

      - name: Tests
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            # Only what the tests import; requirements.txt pulls torch via ultralytics.
            pip install pytest numpy opencv-python-headless
            pytest -q
          else
            echo "no tests yet"
          fi
