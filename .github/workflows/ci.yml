name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A push caused by GITHUB_TOKEN does not start a workflow, and merges are performed by the
  # auto-merge bot holding exactly that token. So the post-merge run on main silently never happens
  # for bot-merged pull requests, and a change that passed its own PR but breaks an earlier one would
  # go unnoticed. This schedule is the backstop: it needs no secret and cannot expire.
  schedule:
    - cron: "0 19 * * *"  # 03:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Bilingual documents in sync
        run: python scripts/check-bilingual.py

      - name: No Chinese in English documents
        run: python scripts/check-language.py

      - name: Progress log well formed
        run: python scripts/check-progress.py

      - name: No machine-specific paths
        run: python scripts/check-paths.py

      - name: Tests
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            # Only what the tests import; requirements.txt pulls torch via ultralytics.
            # Only what the tests import. requirements.txt pulls torch via ultralytics, which CI
          # does not need to check an HTTP skeleton.
          pip install pytest numpy opencv-python-headless sqlalchemy \
                      fastapi uvicorn httpx pydantic-settings "python-jose[cryptography]" bcrypt
            pytest -q
          else
            echo "no tests yet"
          fi
