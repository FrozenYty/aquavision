; ESP32-S3 rig controller — pins, serial protocol and the OLED are described in firmware/README.md.
;
; The board id matches the DevKitC on the parts list. USB CDC is enabled because the S3's native USB
; port is what the PC sees; without it, `Serial` talks to the UART bridge instead and the PC gets
; nothing.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2@^2.35.30
