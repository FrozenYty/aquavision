; ESP32-S3 rig controller - pins, serial protocol and the OLED are described in firmware/README.md.
;
; Two build environments, one per wire (docs/rig-transport-en.md §11):
;
;   rig-serial  UART0 over the USB cable, exactly as today: bench work, the wiring scans, and the
;               fallback on the day. A misbehaving radio has to cost thirty seconds and one cable
;               rather than the demonstration, which is only true while this target keeps compiling
;               and keeps being used.
;   rig-ble     the Bluetooth service, and nothing on the UART: the finished rig and the demonstration.
;
; Exactly one transport implementation is compiled per environment - both define `transport::begin` and
; its neighbours - so the source filter below is what selects the wire, not a runtime branch.
;
; The PC reaches the serial board through the CH343 USB-to-UART bridge, so that sketch must talk on UART0:
; with ARDUINO_USB_CDC_ON_BOOT=1, `Serial` is redirected to the S3's native USB port and the UART
; bridge shows only ROM boot messages - measured on arrival, 11-10, before this flag was flipped.
; UART has the further advantage that the same cable flashes and monitors, with no BOOT button.

[platformio]
default_envs = rig-serial

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2@^2.35.30

[env:rig-serial]
build_src_filter = +<*> -<transport_ble.cpp>

[env:rig-ble]
; `AV_BLE_CARRIER` is read by `config.h`: it selects the OLED's offline line, which is the one string on
; the panel that is false in the other build.
build_flags =
    ${env.build_flags}
    -DAV_BLE_CARRIER=1
build_src_filter = +<*> -<transport.cpp>
