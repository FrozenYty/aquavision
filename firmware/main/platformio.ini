; ESP32-S3 rig controller - pins, serial protocol and the OLED are described in firmware/README.md.
;
; The PC reaches this board through the CH343 USB-to-UART bridge, so the sketch must talk on UART0:
; with ARDUINO_USB_CDC_ON_BOOT=1, `Serial` is redirected to the S3's native USB port and the UART
; bridge shows only ROM boot messages - measured on arrival, 11-10, before this flag was flipped.
; UART has the further advantage that the same cable flashes and monitors, with no BOOT button.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2@^2.35.30
